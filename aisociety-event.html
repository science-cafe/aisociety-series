  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 4c-1 1.5 1 2.5 0 4M15 4c-1 1.5 1 2.5 0 4\"><\u002Fpath><\u002Fsvg>\n<span style=\"font-family: 'Space Grotesk', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em\">Science Café<\u002Fspan>\n<\u002Fa>\n<span aria-hidden=\"true\" style=\"width: 1px; height: 32px; background: #4F7D96\"><\u002Fspan>\n<a href=\"https://engineering.gwu.edu\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display: flex; align-items: center; padding: 6px 0\"><img src=\"3180d663-7e97-4ec4-93fb-93f15c692700\" alt=\"GW Engineering\" style=\"height: 38px; width: auto; display: block\"><\u002Fa>\n<\u002Fdiv>\n<nav aria-label=\"Primary\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px; font-size: 15px\">\n<a href=\"#about\" style=\"color: #E8DDC6; text-decoration: none; padding: 10px 0\">About<\u002Fa>\n<a href=\"#conveners\" style=\"color: #E8DDC6; text-decoration: none; padding: 10px 0\">Conveners<\u002Fa>\n<a href=\"#format\" style=\"color: #E8DDC6; text-decoration: none; padding: 10px 0\">Format<\u002Fa>\n<a href=\"#agenda\" style=\"color: #E8DDC6; text-decoration: none; padding: 10px 0\">Agenda<\u002Fa>\n<a href=\"#questions\" style=\"color: #E8DDC6; text-decoration: none; padding: 10px 0\">Discussion<\u002Fa>\n<a href=\"#outcomes\" style=\"color: #E8DDC6; text-decoration: none; padding: 10px 0\">Outcomes<\u002Fa>\n<a href=\"#rsvp\" style=\"color: #00223E; background: {{accentLight}}; text-decoration: none; padding: 10px 18px; border-radius: 999px; font-weight: 600\">Request a seat<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n<!-- HERO -->\n<section id=\"top\" style=\"background: #033C5A; color: #FFFFFF; padding: 72px 32px 88px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 56px; align-items: end\">\n<div>\n<p style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: {{accentLight}}; margin: 0 0 24px\">Inaugural event · Science Café series<\u002Fp>\n<h1 style=\"font-family: 'Space Grotesk', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: clamp(44px, 6.4vw, 88px); line-height: 0.98; letter-spacing: -0.035em; margin: 0 0 28px\">AI and Society: a conversation across generations<\u002Fh1>\n<p style=\"font-size: 20px; color: #DCE7EE; max-width: 560px; margin: 0 0 36px\">A 90-minute experience room where youth ambassadors, scientists, researchers and museum educators sit at the same table to ask how artificial intelligence is reshaping the way we learn, work and decide.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px\">\n<a href=\"#rsvp\" style=\"background: {{accentLight}}; color: #00223E; text-decoration: none; padding: 15px 26px; border-radius: 999px; font-weight: 600\">Request an invitation<\u002Fa>\n<a href=\"#format\" style=\"border: 1px solid #6A92A8; color: #FFFFFF; text-decoration: none; padding: 15px 26px; border-radius: 999px; font-weight: 600\">How the room works<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top: 1px solid #2F6683\">\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid #2F6683\">\n<div style=\"padding: 22px 20px 22px 0; border-right: 1px solid #2F6683\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #B4CAD6\">Date and Time<\u002Fdiv>\n<div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; margin-top: 6px\">November 07, 2026<\u002Fdiv>\n<div style=\"color: #C8D9E3; font-size: 15px\">1:30 PM to 3:00 PM<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 22px 0 22px 20px\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #B4CAD6\">Duration<\u002Fdiv>\n<div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; margin-top: 6px\">90 minutes<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid #2F6683\">\n<div style=\"padding: 22px 20px 22px 0; border-right: 1px solid #2F6683\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #B4CAD6\">Venue<\u002Fdiv>\n<a href=\"https://www.google.com/maps/place/Science+%26+Engineering+Hall,+800+22nd+St+NW,+Washington,+DC+20052/@38.900051,-77.0494258,719m/data=!3m2!1e3!4b1!4m6!3m5!1s0x89b7b7b19fe1917f:0x90b584e62452ed2b!8m2!3d38.900051!4d-77.0494258!16s%2Fg%2F1q5bt61jk?entry=ttu&amp;g_ep=EgoyMDI2MTAxNC4wIKXMDSoASAFQAw%3D%3D\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display: block; color: #FFFFFF; text-decoration: none; margin-top: 6px\"><span style=\"display: inline-flex; align-items: center; gap: 8px; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; text-decoration: underline; text-decoration-color: #D6BF91; text-underline-offset: 5px; text-decoration-thickness: 2px\">Science &amp; Engineering Hall, Suite 2000 <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M6 3h7v7M13 3L4 12\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"display: block; color: #C8D9E3; font-size: 15px; margin-top: 4px\">800 22nd St NW, Washington, DC 20052 · The George Washington University<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<div style=\"padding: 22px 0 22px 20px\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #B4CAD6\">In the room<\u002Fdiv>\n<div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; margin-top: 6px\">20 invited participants<\u002Fdiv>\n<div style=\"color: #C8D9E3; font-size: 15px\">Small groups, guided prompts<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PARTNERS STRIP -->\n<section aria-label=\"Presenting partners\" style=\"background: #FFFFFF; border-bottom: 1px solid #E8DDC6; padding: 28px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px 40px\">\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #4E6273\">Presented in collaboration by<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px 44px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px\">\n<a href=\"https://ssec.si.edu\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #033C5A; text-decoration: underline; text-decoration-color: #D6BF91; text-underline-offset: 5px; text-decoration-thickness: 2px; padding: 8px 0\">Smithsonian Science Education Center<\u002Fa>\n<a href=\"https://scicomm-initiative.github.io/scicomm-site/about.html\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #033C5A; text-decoration: underline; text-decoration-color: #D6BF91; text-underline-offset: 5px; text-decoration-thickness: 2px; padding: 8px 0\">SciComm Initiative<\u002Fa>\n<a href=\"https://mae.engineering.gwu.edu\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #033C5A; text-decoration: underline; text-decoration-color: #D6BF91; text-underline-offset: 5px; text-decoration-thickness: 2px; padding: 8px 0\">GWU Mechanical &amp; Aerospace Engineering<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ABOUT -->\n<section id=\"about\" style=\"padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 56px\">\n<div>\n<p style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: {{accent}}; margin: 0 0 16px\">01 · About the café<\u002Fp>\n<h2 style=\"font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 3.6vw, 48px); line-height: 1.05; letter-spacing: -0.025em; margin: 0\">No lectures. No slides. Just good questions about AI.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 18px; color: #2E4456\">\n<p style=\"margin: 0\">A Science Café is a space where curious people come together to talk about science. This inaugural edition focuses on one of the most consequential questions of our time: how artificial intelligence and society shape each other.<\u002Fp>\n<p style=\"margin: 0\">Rather than a panel of experts speaking to an audience, everyone participates. Short introductory remarks set the scene, then participants move into small groups to explore prompted questions — bringing together the perspectives of young people, working scientists, university researchers and museum educators.<\u002Fp>\n<p style=\"margin: 0\">With participants' consent, what's said in the room becomes something lasting: educational materials for the Smithsonian Science Education Center and a public recap for the SciComm Initiative.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width: 1200px; margin: 64px auto 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px\">\n<article style=\"background: #FFFFFF; border: 1px solid #E8DDC6; border-top: 4px solid #D6BF91; border-radius: 16px; padding: 28px\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #4E6273; margin-bottom: 14px\">Partner · Education<\u002Fdiv>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin: 0 0 10px\"><a href=\"https://ssec.si.edu\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #033C5A\">Smithsonian Science Education Center<\u002Fa><\u002Fh3>\n<p style=\"margin: 0; color: #3F5566; font-size: 16px\">Brings museum educators and youth ambassadors from NESST, and will receive classroom-ready educational materials developed from the discussions.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #FFFFFF; border: 1px solid #E8DDC6; border-top: 4px solid #D6BF91; border-radius: 16px; padding: 28px\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #4E6273; margin-bottom: 14px\">Partner · Communication<\u002Fdiv>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin: 0 0 10px\"><a href=\"https://scicomm-initiative.github.io/scicomm-site/about.html\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #033C5A\">SciComm Initiative<\u002Fa><\u002Fh3>\n<p style=\"margin: 0; color: #3F5566; font-size: 16px\">Hosts the Science Café series and will publish a blog post recapping the conversation for those who couldn't attend.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #FFFFFF; border: 1px solid #E8DDC6; border-top: 4px solid #D6BF91; border-radius: 16px; padding: 28px\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #4E6273; margin-bottom: 14px\">Partner · Host<\u002Fdiv>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin: 0 0 10px\"><a href=\"https://mae.engineering.gwu.edu\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #033C5A\">GWU Mechanical &amp; Aerospace Engineering<\u002Fa><\u002Fh3>\n<p style=\"margin: 0; color: #3F5566; font-size: 16px\">The George Washington University's Department of Mechanical &amp; Aerospace Engineering hosts the event and brings academic researchers to the table.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- CONVENERS -->\n<section id=\"conveners\" style=\"background: #FFFFFF; border-top: 1px solid #E8DDC6; border-bottom: 1px solid #E8DDC6; padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto\">\n<p style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: {{accent}}; margin: 0 0 16px\">02 · Conveners<\u002Fp>\n<h2 style=\"font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 3.6vw, 48px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 48px; max-width: 760px\">Bringing the room together<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 24px\">\n\n<article style=\"display: flex; flex-wrap: wrap; gap: 28px; align-items: center; background: #F6F1E8; border-radius: 20px; padding: 28px\">\n<img src=\"9174e64d-f5c1-446e-8733-90644b24fe0a\" alt=\"Dr. Kartik Bulusu\" style=\"width: 160px; height: 200px; flex-shrink: 0; border-radius: 14px; object-fit: cover; object-position: center 20%; display: block; border-bottom: 4px solid #D6BF91\">\n<div style=\"flex: 1 1 220px; min-width: 0\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #4E6273; margin-bottom: 10px\">Convener · GWU<\u002Fdiv>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 28px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 8px; color: #033C5A\">Dr. Kartik Bulusu<\u002Fh3>\n<p style=\"margin: 0 0 4px; font-weight: 600\">Associate Research Professor<\u002Fp>\n<p style=\"margin: 0; color: #3F5566\">Department of Mechanical &amp; Aerospace Engineering, The George Washington University<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px\">\n<a href=\"https://www.linkedin.com/in/kartik-bulusu-1295261/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #CDBF9F; color: #033C5A; text-decoration: none; font-size: 14px; font-weight: 600; box-sizing: border-box\">LinkedIn <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M6 3h7v7M13 3L4 12\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<a href=\"https://engineering.gwu.edu/kartik-v-bulusu\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #CDBF9F; color: #033C5A; text-decoration: none; font-size: 14px; font-weight: 600; box-sizing: border-box\">Faculty bio <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M6 3h7v7M13 3L4 12\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<a href=\"https://bulusuk.github.io\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #CDBF9F; color: #033C5A; text-decoration: none; font-size: 14px; font-weight: 600; box-sizing: border-box\">Personal website <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M6 3h7v7M13 3L4 12\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display: flex; flex-wrap: wrap; gap: 28px; align-items: center; background: #F6F1E8; border-radius: 20px; padding: 28px\">\n<img src=\"b58cdbd1-80ea-48ac-b3b0-29b024c8ecf7\" alt=\"Heidi Gibson\" style=\"width: 160px; height: 200px; flex-shrink: 0; border-radius: 14px; object-fit: cover; object-position: center 20%; display: block; border-bottom: 4px solid #D6BF91\">\n<div style=\"flex: 1 1 220px; min-width: 0\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #4E6273; margin-bottom: 10px\">Convener · Smithsonian<\u002Fdiv>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 28px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 8px; color: #033C5A\">Heidi Gibson<\u002Fh3>\n<p style=\"margin: 0 0 4px; font-weight: 600\">Manager, Global Sustainability Series<\u002Fp>\n<p style=\"margin: 0\"><a href=\"https://ssec.si.edu\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #0067B0\">Smithsonian Science Education Center<\u002Fa><\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px\">\n<a href=\"https://www.linkedin.com/in/heidi-gibson-5b341a64/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #CDBF9F; color: #033C5A; text-decoration: none; font-size: 14px; font-weight: 600; box-sizing: border-box\">LinkedIn <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M6 3h7v7M13 3L4 12\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- WHO'S IN THE ROOM -->\n<section style=\"padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto\">\n<p style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: {{accent}}; margin: 0 0 16px\">03 · Who's in the room<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 48px\">\n<h2 style=\"font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 3.6vw, 48px); line-height: 1.05; letter-spacing: -0.025em; margin: 0; max-width: 680px\">Twenty voices, four vantage points, one table.<\u002Fh2>\n<p style=\"margin: 0; max-width: 400px; color: #3F5566\">Each small group mixes perspectives on purpose, so a high-school student and a researcher may find themselves answering the same question.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 0; border-top: 2px solid #033C5A\">\n<div style=\"padding: 28px 24px 28px 0; border-bottom: 1px solid #E8DDC6\">\n<div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 700; color: #AA9868; line-height: 1\">A<\u002Fdiv>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 20px; margin: 18px 0 8px\">NESST Youth Ambassadors<\u002Fh3>\n<p style=\"margin: 0; color: #3F5566; font-size: 16px\">Young people who will live longest with the choices being made about AI today.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 28px 24px 28px 0; border-bottom: 1px solid #E8DDC6\">\n<div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 700; color: #AA9868; line-height: 1\">B<\u002Fdiv>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 20px; margin: 18px 0 8px\">Scientific Ambassadors<\u002Fh3>\n<p style=\"margin: 0; color: #3F5566; font-size: 16px\">Practicing scientists who translate research for the public and use AI in their work.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 28px 24px 28px 0; border-bottom: 1px solid #E8DDC6\">\n<div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 700; color: #AA9868; line-height: 1\">C<\u002Fdiv>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 20px; margin: 18px 0 8px\">GW Academics<\u002Fh3>\n<p style=\"margin: 0; color: #3F5566; font-size: 16px\">Faculty and researchers from The George Washington University studying and building intelligent systems.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 28px 24px 28px 0; border-bottom: 1px solid #E8DDC6\">\n<div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 700; color: #AA9868; line-height: 1\">D<\u002Fdiv>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 20px; margin: 18px 0 8px\">Smithsonian Personnel<\u002Fh3>\n<p style=\"margin: 0; color: #3F5566; font-size: 16px\">Educators who turn big ideas into learning experiences for classrooms and communities.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FORMAT -->\n<section id=\"format\" style=\"background: #FFFFFF; border-top: 1px solid #E8DDC6; border-bottom: 1px solid #E8DDC6; padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto\">\n<p style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: {{accent}}; margin: 0 0 16px\">04 · The experience room<\u002Fp>\n<h2 style=\"font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 3.6vw, 48px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 48px; max-width: 760px\">How the 90 minutes work<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 20px\">\n<div style=\"background: #033C5A; color: #FFFFFF; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; color: {{accentLight}}\">Step 1<\u002Fspan>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin: 0\">Set the scene<\u002Fh3>\n<p style=\"margin: 0; color: #DCE7EE; font-size: 16px\">Brief introductory remarks frame why AI and society matters now, and what we hope to learn together.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #F6F1E8; border: 1px solid #E8DDC6; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; color: {{accent}}\">Step 2<\u002Fspan>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin: 0\">Break into small groups<\u002Fh3>\n<p style=\"margin: 0; color: #3F5566; font-size: 16px\">Participants split into mixed groups of four to five, each with a facilitator and a set of prompted questions.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #F6F1E8; border: 1px solid #E8DDC6; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; color: {{accent}}\">Step 3<\u002Fspan>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin: 0\">Share across tables<\u002Fh3>\n<p style=\"margin: 0; color: #3F5566; font-size: 16px\">Each group reports its sharpest insight and its biggest open question back to the full room.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #F6F1E8; border: 1px solid #E8DDC6; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; color: {{accent}}\">Step 4<\u002Fspan>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin: 0\">Capture, with consent<\u002Fh3>\n<p style=\"margin: 0; color: #3F5566; font-size: 16px\">Participants choose whether and how their contributions are shared in the educational materials and blog post.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- AGENDA + INTRO REMARKS -->\n<section id=\"agenda\" style=\"padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 64px\">\n<div>\n<p style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: {{accent}}; margin: 0 0 16px\">05 · Agenda<\u002Fp>\n<h2 style=\"font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 8px\">Run of show<\u002Fh2>\n<p style=\"margin: 0 0 32px; color: #4E6273; font-size: 15px\">Proposed timing; final schedule to be confirmed.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; border-top: 2px solid #033C5A\">\n<div style=\"display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; padding: 18px 0; border-bottom: 1px solid #E8DDC6\">\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; color: #4E6273\">0:00–0:10<\u002Fspan>\n<div><strong style=\"font-weight: 600\">Arrival &amp; welcome<\u002Fstrong><div style=\"color: #3F5566; font-size: 15px\">Name tags, refreshments, group assignments<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; padding: 18px 0; border-bottom: 1px solid #E8DDC6\">\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; color: #4E6273\">0:10–0:20<\u002Fspan>\n<div><strong style=\"font-weight: 600\">Introductory remarks<\u002Fstrong><div style=\"color: #3F5566; font-size: 15px\">Welcome from the conveners and framing of the topic<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; padding: 18px 0; border-bottom: 1px solid #E8DDC6\">\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; color: #4E6273\">0:20–0:45<\u002Fspan>\n<div><strong style=\"font-weight: 600\">Small-group round one<\u002Fstrong><div style=\"color: #3F5566; font-size: 15px\">Mixed tables explore a first set of prompts<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; padding: 18px 0; border-bottom: 1px solid #E8DDC6\">\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; color: #4E6273\">0:45–1:05<\u002Fspan>\n<div><strong style=\"font-weight: 600\">Small-group round two<\u002Fstrong><div style=\"color: #3F5566; font-size: 15px\">Groups rotate or go deeper on a second theme<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; padding: 18px 0; border-bottom: 1px solid #E8DDC6\">\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; color: #4E6273\">1:05–1:20<\u002Fspan>\n<div><strong style=\"font-weight: 600\">Report back<\u002Fstrong><div style=\"color: #3F5566; font-size: 15px\">Each table shares one insight and one open question<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; padding: 18px 0; border-bottom: 1px solid #E8DDC6\">\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; color: #4E6273\">1:20–1:30<\u002Fspan>\n<div><strong style=\"font-weight: 600\">Consent, reflection &amp; close<\u002Fstrong><div style=\"color: #3F5566; font-size: 15px\">Sharing preferences, next-topic vote, thank-yous<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<p style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: {{accent}}; margin: 0 0 16px\">06 · Introductory remarks<\u002Fp>\n<h2 style=\"font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 32px\">Opening the conversation<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; gap: 18px; align-items: center; padding: 18px; background: #FFFFFF; border: 1px solid #E8DDC6; border-radius: 14px\">\n<div style=\"width: 56px; height: 56px; border-radius: 999px; background: #CCE3F4; color: #033C5A; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; flex-shrink: 0\">KB<\u002Fdiv>\n<div><strong style=\"font-weight: 600\">Dr. Kartik Bulusu, GWU MAE Department<\u002Fstrong><div style=\"color: #3F5566; font-size: 15px\">Welcome, purpose of the café, and AI in research and engineering<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 18px; align-items: center; padding: 18px; background: #FFFFFF; border: 1px solid #E8DDC6; border-radius: 14px\">\n<div style=\"width: 56px; height: 56px; border-radius: 999px; background: #E8DDC6; color: #033C5A; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; flex-shrink: 0\">HG<\u002Fdiv>\n<div><strong style=\"font-weight: 600\">Heidi Gibson, Smithsonian Science Education Center<\u002Fstrong><div style=\"color: #3F5566; font-size: 15px\">Why AI literacy matters for young learners<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<blockquote style=\"margin: 32px 0 0; padding: 28px; background: #033C5A; color: #FFFFFF; border-radius: 16px\">\n<p style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; line-height: 1.35; margin: 0 0 14px\">Framing question for the evening: what do we want AI to do for society, and who gets to decide?<\u002Fp>\n<footer style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; color: {{accentLight}}\">Opening prompt · to be refined by the conveners<\u002Ffooter>\n<\u002Fblockquote>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- DISCUSSION THEMES (interactive) -->\n<section id=\"questions\" style=\"background: #FFFFFF; border-top: 1px solid #E8DDC6; border-bottom: 1px solid #E8DDC6; padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto\">\n<p style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: {{accent}}; margin: 0 0 16px\">07 · Discussion details<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 40px\">\n<h2 style=\"font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 3.6vw, 48px); line-height: 1.05; letter-spacing: -0.025em; margin: 0; max-width: 680px\">Prompted questions for the small groups<\u002Fh2>\n<p style=\"margin: 0; max-width: 400px; color: #3F5566\">Draft themes for facilitators. Each table takes one theme per round; there are no wrong answers.<\u002Fp>\n<\u002Fdiv>\n<div role=\"tablist\" aria-label=\"Discussion themes\" style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 28px\">\n<sc-for list=\"{{themes}}\" as=\"t\" hint-placeholder-count=\"5\">\n<sc-if value=\"{{t.isSel}}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" role=\"tab\" aria-selected=\"true\" sc-camel-on-click=\"{{t.pick}}\" style=\"background: #033C5A; color: #FFFFFF; border: 1px solid #033C5A; border-radius: 999px; padding: 12px 20px; font-weight: 600; font-size: 15px; cursor: pointer; min-height: 44px\">{{t.label}}<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{t.notSel}}\" hint-placeholder-val=\"{{ true }}\">\n<button type=\"button\" role=\"tab\" aria-selected=\"false\" sc-camel-on-click=\"{{t.pick}}\" style=\"background: #FFFFFF; color: #00223E; border: 1px solid #CDBF9F; border-radius: 999px; padding: 12px 20px; font-weight: 500; font-size: 15px; cursor: pointer; min-height: 44px\">{{t.label}}<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div role=\"tabpanel\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 24px; background: #F6F1E8; border: 1px solid #E8DDC6; border-radius: 20px; padding: 40px\">\n<div>\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; color: #4E6273; margin-bottom: 10px\">Theme {{active.num}} of 5<\u002Fdiv>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 32px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 14px; color: #033C5A\">{{active.label}}<\u002Fh3>\n<p style=\"margin: 0; color: #3F5566\">{{active.intro}}<\u002Fp>\n<\u002Fdiv>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px\">\n<sc-for list=\"{{active.qs}}\" as=\"q\" hint-placeholder-count=\"3\">\n<li style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; padding: 18px; border-radius: 12px; background: #FFFFFF\">\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 500; color: {{accent}}\">{{q.n}}<\u002Fspan>\n<span style=\"font-size: 17px\">{{q.text}}<\u002Fspan>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- OUTCOMES -->\n<section id=\"outcomes\" style=\"background: #033C5A; color: #FFFFFF; padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto\">\n<p style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: {{accentLight}}; margin: 0 0 16px\">08 · Targeted outcomes<\u002Fp>\n<h2 style=\"font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 3.6vw, 48px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 48px; max-width: 760px\">What the conversation becomes<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px\">\n<div style=\"border: 1px solid #2F6683; border-radius: 16px; padding: 32px\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\" style=\"color: {{accentLight}}\"><path d=\"M4 8l12-4 12 4-12 4z\"><\u002Fpath><path d=\"M8 10v8c0 2 4 4 8 4s8-2 8-4v-8\"><\u002Fpath><path d=\"M28 8v9\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin: 20px 0 10px\">Educational materials<\u002Fh3>\n<p style=\"margin: 0 0 14px; color: #DCE7EE; font-size: 16px\">Discussion guides and learning resources developed from the room's questions and insights, for the Smithsonian Science Education Center.<\u002Fp>\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #B4CAD6\">For: SSEC educators &amp; classrooms<\u002Fspan>\n<\u002Fdiv>\n<div style=\"border: 1px solid #2F6683; border-radius: 16px; padding: 32px\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\" style=\"color: {{accentLight}}\"><path d=\"M7 4h13l5 5v19H7z\"><\u002Fpath><path d=\"M20 4v5h5\"><\u002Fpath><path d=\"M11 15h10M11 19h10M11 23h6\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin: 20px 0 10px\">SciComm blog post<\u002Fh3>\n<p style=\"margin: 0 0 14px; color: #DCE7EE; font-size: 16px\">A public recap of the conversation so people who couldn't attend can follow along and keep the discussion going.<\u002Fp>\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #B4CAD6\">For: the SciComm Initiative community<\u002Fspan>\n<\u002Fdiv>\n<div style=\"border: 1px solid #2F6683; border-radius: 16px; padding: 32px\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\" style=\"color: {{accentLight}}\"><rect x=\"4\" y=\"6\" width=\"24\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M4 11h24M12 28h8M16 24v4\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin: 20px 0 10px\">Event archive<\u002Fh3>\n<p style=\"margin: 0 0 14px; color: #DCE7EE; font-size: 16px\">This site will host highlights, shared quotes and resources after the event, and seed topics for future cafés.<\u002Fp>\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #B4CAD6\">For: participants &amp; the public<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top: 48px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 40px; padding-top: 40px; border-top: 1px solid #2F6683\">\n<div>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 26px; margin: 0 0 12px\">Your words, your choice<\u002Fh3>\n<p style=\"margin: 0; color: #DCE7EE\">Nothing said in the room is published without consent. At the close of the café, each participant chooses how their contributions may be used.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 12px\">\n<div style=\"background: #00223E; border-radius: 12px; padding: 18px\"><strong style=\"font-weight: 600; display: block; margin-bottom: 4px; color: {{accentLight}}\">Attributed<\u002Fstrong><span style=\"color: #C8D9E3; font-size: 15px\">Quoted with my name<\u002Fspan><\u002Fdiv>\n<div style=\"background: #00223E; border-radius: 12px; padding: 18px\"><strong style=\"font-weight: 600; display: block; margin-bottom: 4px; color: {{accentLight}}\">Anonymous<\u002Fstrong><span style=\"color: #C8D9E3; font-size: 15px\">Ideas used, no name<\u002Fspan><\u002Fdiv>\n<div style=\"background: #00223E; border-radius: 12px; padding: 18px\"><strong style=\"font-weight: 600; display: block; margin-bottom: 4px; color: {{accentLight}}\">Private<\u002Fstrong><span style=\"color: #C8D9E3; font-size: 15px\">Stays in the room<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- RSVP -->\n<section id=\"rsvp\" style=\"padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 56px; align-items: center\">\n<div>\n<p style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: {{accent}}; margin: 0 0 16px\">09 · Join us<\u002Fp>\n<h2 style=\"font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 3.6vw, 48px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 20px\">Request a seat at the table<\u002Fh2>\n<p style=\"margin: 0 0 18px; color: #3F5566\">This inaugural café is limited to 20 invited participants so every voice can be heard. If you're part of one of our partner communities and would like to take part, let us know.<\u002Fp>\n<p style=\"margin: 0; color: #3F5566\">Free to attend. Participants under 18 will need a parent or guardian's permission.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #E8DDC6; border-top: 6px solid #D6BF91; border-radius: 20px; padding: 40px; display: flex; flex-direction: column; gap: 18px\">\n<svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 40 40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\" style=\"color: #033C5A\"><rect x=\"8\" y=\"5\" width=\"24\" height=\"31\" rx=\"3\"><\u002Frect><path d=\"M15 5v4h10V5\"><\u002Fpath><path d=\"M14 18l2.5 2.5L21 16M14 27l2.5 2.5L21 25M24 19h3M24 28h3\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 26px; margin: 0; color: #033C5A\">Registration form<\u002Fh3>\n<p style=\"margin: 0; color: #3F5566\">Tell us who you are and how you'd like to take part. The organizers will follow up by email with confirmation and event details.<\u002Fp>\n<a href=\"https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=Kl6bmOQU_k6Tt4zdX8XRHN_Xo2XYC-FDpL-yi1L65YtUQldJR0YwVzI2NjVESzdIWDVCWUFXRUFVTS4u\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; background: #033C5A; color: #FFFFFF; text-decoration: none; border-radius: 999px; padding: 15px 26px; font-weight: 600; font-size: 16px; min-height: 48px; box-sizing: border-box\">Open the registration form <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M6 3h7v7M13 3L4 12\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #4E6273\">Opens Microsoft Forms in a new tab<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer style=\"background: #00223E; color: #C8D9E3; padding: 56px 32px 40px; border-top: 4px solid {{accentLight}}\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 28px\">\n<div style=\"max-width: 420px\">\n<div style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; color: #FFFFFF; margin-bottom: 8px\">Science Café<\u002Fdiv>\n<p style=\"margin: 0; font-size: 15px\">A space where curious people come together to talk about science. Part of the <a href=\"https://scicomm-initiative.github.io/scicomm-site/about.html\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #E8DDC6\">SciComm Initiative<\u002Fa>.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px 28px; font-size: 15px\">\n<a href=\"https://scicomm-initiative.github.io/scicomm-site/cafe.html\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #E8DDC6\">SciComm Initiative Science Café<\u002Fa>\n<a href=\"https://scicomm-initiative.github.io/scicomm-site/blog.html\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #E8DDC6\">Blog<\u002Fa>\n<a href=\"https://scicomm-initiative.github.io/scicomm-site/about.html#contact\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #E8DDC6\">Contact<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top: 1px solid #1D4566; padding-top: 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 14px\">\n<span style=\"display: flex; flex-wrap: wrap; gap: 6px 10px\">\n<a href=\"https://ssec.si.edu\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #C8D9E3\">Smithsonian Science Education Center<\u002Fa><span aria-hidden=\"true\">·<\u002Fspan>\n<a href=\"https://scicomm-initiative.github.io/scicomm-site/about.html\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #C8D9E3\">SciComm Initiative<\u002Fa><span aria-hidden=\"true\">·<\u002Fspan>\n<a href=\"https://mae.engineering.gwu.edu\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #C8D9E3\">GWU Mechanical &amp; Aerospace Engineering<\u002Fa>\n<\u002Fspan>\n<span>© 2026 SciComm Initiative<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"><style>x-dc>*{display:none!important}x-dc>[data-dc-static]{display:block!important}<\u002Fstyle>\n\n<div style=\"font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, sans-serif; color: #00223E; background: #F6F1E8; line-height: 1.55; font-size: 17px\" data-canvas-width=\"1440\" data-canvas-height=\"7200\" data-document-role=\"page\" data-label=\"Event website\">\n\n\n<header style=\"background: #033C5A; color: #FFFFFF; border-bottom: 3px solid #D6BF91\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 18px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n<div style=\"display: flex; align-items: center; gap: 18px; flex-wrap: wrap\">\n<a href=\"#top\" style=\"display: flex; align-items: center; gap: 12px; color: #FFFFFF; text-decoration: none\">\n<svg width=\"30\" height=\"30\" viewBox=\"0 0 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\"><path d=\"M6 11h15v7a6 6 0 0 1-6 6h-3a6 6 0 0 1-6-6z\"><\u002Fpath><path d=\"M21 13h2.5a2.5 2.5 0 0 1 0 5H21\"><\u002Fpath><path d=\"M11 4c-1 1.5 1 2.5 0 4M15 4c-1 1.5 1 2.5 0 4\"><\u002Fpath><\u002Fsvg>\n<span style=\"font-family: 'Space Grotesk', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em\">Science Café<\u002Fspan>\n<\u002Fa>\n<span aria-hidden=\"true\" style=\"width: 1px; height: 32px; background: #4F7D96\"><\u002Fspan>\n<a href=\"https://engineering.gwu.edu\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display: flex; align-items: center; padding: 6px 0\"><img src=\"3180d663-7e97-4ec4-93fb-93f15c692700\" alt=\"GW Engineering\" style=\"height: 38px; width: auto; display: block\"><\u002Fa>\n<\u002Fdiv>\n<nav aria-label=\"Primary\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px; font-size: 15px\">\n<a href=\"#about\" style=\"color: #E8DDC6; text-decoration: none; padding: 10px 0\">About<\u002Fa>\n<a href=\"#conveners\" style=\"color: #E8DDC6; text-decoration: none; padding: 10px 0\">Conveners<\u002Fa>\n<a href=\"#format\" style=\"color: #E8DDC6; text-decoration: none; padding: 10px 0\">Format<\u002Fa>\n<a href=\"#agenda\" style=\"color: #E8DDC6; text-decoration: none; padding: 10px 0\">Agenda<\u002Fa>\n<a href=\"#questions\" style=\"color: #E8DDC6; text-decoration: none; padding: 10px 0\">Discussion<\u002Fa>\n<a href=\"#outcomes\" style=\"color: #E8DDC6; text-decoration: none; padding: 10px 0\">Outcomes<\u002Fa>\n<a href=\"#rsvp\" style=\"color: #00223E; background: #D6BF91; text-decoration: none; padding: 10px 18px; border-radius: 999px; font-weight: 600\">Request a seat<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n\n<section id=\"top\" style=\"background: #033C5A; color: #FFFFFF; padding: 72px 32px 88px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 56px; align-items: end\">\n<div>\n<p style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #D6BF91; margin: 0 0 24px\">Inaugural event · Science Café series<\u002Fp>\n<h1 style=\"font-family: 'Space Grotesk', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: clamp(44px, 6.4vw, 88px); line-height: 0.98; letter-spacing: -0.035em; margin: 0 0 28px\">AI and Society: a conversation across generations<\u002Fh1>\n<p style=\"font-size: 20px; color: #DCE7EE; max-width: 560px; margin: 0 0 36px\">A 90-minute experience room where youth ambassadors, scientists, researchers and museum educators sit at the same table to ask how artificial intelligence is reshaping the way we learn, work and decide.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px\">\n<a href=\"#rsvp\" style=\"background: #D6BF91; color: #00223E; text-decoration: none; padding: 15px 26px; border-radius: 999px; font-weight: 600\">Request an invitation<\u002Fa>\n<a href=\"#format\" style=\"border: 1px solid #6A92A8; color: #FFFFFF; text-decoration: none; padding: 15px 26px; border-radius: 999px; font-weight: 600\">How the room works<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top: 1px solid #2F6683\">\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid #2F6683\">\n<div style=\"padding: 22px 20px 22px 0; border-right: 1px solid #2F6683\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #B4CAD6\">Date and Time<\u002Fdiv>\n<div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; margin-top: 6px\">November 07, 2026<\u002Fdiv>\n<div style=\"color: #C8D9E3; font-size: 15px\">1:30 PM to 3:00 PM<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 22px 0 22px 20px\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #B4CAD6\">Duration<\u002Fdiv>\n<div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; margin-top: 6px\">90 minutes<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid #2F6683\">\n<div style=\"padding: 22px 20px 22px 0; border-right: 1px solid #2F6683\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #B4CAD6\">Venue<\u002Fdiv>\n<a href=\"https://www.google.com/maps/place/Science+%26+Engineering+Hall,+800+22nd+St+NW,+Washington,+DC+20052/@38.900051,-77.0494258,719m/data=!3m2!1e3!4b1!4m6!3m5!1s0x89b7b7b19fe1917f:0x90b584e62452ed2b!8m2!3d38.900051!4d-77.0494258!16s%2Fg%2F1q5bt61jk?entry=ttu&amp;g_ep=EgoyMDI2MTAxNC4wIKXMDSoASAFQAw%3D%3D\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display: block; color: #FFFFFF; text-decoration: none; margin-top: 6px\"><span style=\"display: inline-flex; align-items: center; gap: 8px; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; text-decoration: underline; text-decoration-color: #D6BF91; text-underline-offset: 5px; text-decoration-thickness: 2px\">Science &amp; Engineering Hall, Suite 2000 <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M6 3h7v7M13 3L4 12\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"display: block; color: #C8D9E3; font-size: 15px; margin-top: 4px\">800 22nd St NW, Washington, DC 20052 · The George Washington University<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<div style=\"padding: 22px 0 22px 20px\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #B4CAD6\">In the room<\u002Fdiv>\n<div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; margin-top: 6px\">20 invited participants<\u002Fdiv>\n<div style=\"color: #C8D9E3; font-size: 15px\">Small groups, guided prompts<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section aria-label=\"Presenting partners\" style=\"background: #FFFFFF; border-bottom: 1px solid #E8DDC6; padding: 28px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px 40px\">\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #4E6273\">Presented in collaboration by<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px 44px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px\">\n<a href=\"https://ssec.si.edu\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #033C5A; text-decoration: underline; text-decoration-color: #D6BF91; text-underline-offset: 5px; text-decoration-thickness: 2px; padding: 8px 0\">Smithsonian Science Education Center<\u002Fa>\n<a href=\"https://scicomm-initiative.github.io/scicomm-site/about.html\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #033C5A; text-decoration: underline; text-decoration-color: #D6BF91; text-underline-offset: 5px; text-decoration-thickness: 2px; padding: 8px 0\">SciComm Initiative<\u002Fa>\n<a href=\"https://mae.engineering.gwu.edu\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #033C5A; text-decoration: underline; text-decoration-color: #D6BF91; text-underline-offset: 5px; text-decoration-thickness: 2px; padding: 8px 0\">GWU Mechanical &amp; Aerospace Engineering<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"about\" style=\"padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 56px\">\n<div>\n<p style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #033C5A; margin: 0 0 16px\">01 · About the café<\u002Fp>\n<h2 style=\"font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 3.6vw, 48px); line-height: 1.05; letter-spacing: -0.025em; margin: 0\">No lectures. No slides. Just good questions about AI.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 18px; color: #2E4456\">\n<p style=\"margin: 0\">A Science Café is a space where curious people come together to talk about science. This inaugural edition focuses on one of the most consequential questions of our time: how artificial intelligence and society shape each other.<\u002Fp>\n<p style=\"margin: 0\">Rather than a panel of experts speaking to an audience, everyone participates. Short introductory remarks set the scene, then participants move into small groups to explore prompted questions — bringing together the perspectives of young people, working scientists, university researchers and museum educators.<\u002Fp>\n<p style=\"margin: 0\">With participants' consent, what's said in the room becomes something lasting: educational materials for the Smithsonian Science Education Center and a public recap for the SciComm Initiative.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width: 1200px; margin: 64px auto 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px\">\n<article style=\"background: #FFFFFF; border: 1px solid #E8DDC6; border-top: 4px solid #D6BF91; border-radius: 16px; padding: 28px\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #4E6273; margin-bottom: 14px\">Partner · Education<\u002Fdiv>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin: 0 0 10px\"><a href=\"https://ssec.si.edu\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #033C5A\">Smithsonian Science Education Center<\u002Fa><\u002Fh3>\n<p style=\"margin: 0; color: #3F5566; font-size: 16px\">Brings museum educators and youth ambassadors from NESST, and will receive classroom-ready educational materials developed from the discussions.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #FFFFFF; border: 1px solid #E8DDC6; border-top: 4px solid #D6BF91; border-radius: 16px; padding: 28px\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #4E6273; margin-bottom: 14px\">Partner · Communication<\u002Fdiv>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin: 0 0 10px\"><a href=\"https://scicomm-initiative.github.io/scicomm-site/about.html\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #033C5A\">SciComm Initiative<\u002Fa><\u002Fh3>\n<p style=\"margin: 0; color: #3F5566; font-size: 16px\">Hosts the Science Café series and will publish a blog post recapping the conversation for those who couldn't attend.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #FFFFFF; border: 1px solid #E8DDC6; border-top: 4px solid #D6BF91; border-radius: 16px; padding: 28px\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #4E6273; margin-bottom: 14px\">Partner · Host<\u002Fdiv>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin: 0 0 10px\"><a href=\"https://mae.engineering.gwu.edu\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #033C5A\">GWU Mechanical &amp; Aerospace Engineering<\u002Fa><\u002Fh3>\n<p style=\"margin: 0; color: #3F5566; font-size: 16px\">The George Washington University's Department of Mechanical &amp; Aerospace Engineering hosts the event and brings academic researchers to the table.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"conveners\" style=\"background: #FFFFFF; border-top: 1px solid #E8DDC6; border-bottom: 1px solid #E8DDC6; padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto\">\n<p style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #033C5A; margin: 0 0 16px\">02 · Conveners<\u002Fp>\n<h2 style=\"font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 3.6vw, 48px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 48px; max-width: 760px\">Bringing the room together<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 24px\">\n\n<article style=\"display: flex; flex-wrap: wrap; gap: 28px; align-items: center; background: #F6F1E8; border-radius: 20px; padding: 28px\">\n<img src=\"9174e64d-f5c1-446e-8733-90644b24fe0a\" alt=\"Dr. Kartik Bulusu\" style=\"width: 160px; height: 200px; flex-shrink: 0; border-radius: 14px; object-fit: cover; object-position: center 20%; display: block; border-bottom: 4px solid #D6BF91\">\n<div style=\"flex: 1 1 220px; min-width: 0\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #4E6273; margin-bottom: 10px\">Convener · GWU<\u002Fdiv>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 28px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 8px; color: #033C5A\">Dr. Kartik Bulusu<\u002Fh3>\n<p style=\"margin: 0 0 4px; font-weight: 600\">Associate Research Professor<\u002Fp>\n<p style=\"margin: 0; color: #3F5566\">Department of Mechanical &amp; Aerospace Engineering, The George Washington University<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px\">\n<a href=\"https://www.linkedin.com/in/kartik-bulusu-1295261/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #CDBF9F; color: #033C5A; text-decoration: none; font-size: 14px; font-weight: 600; box-sizing: border-box\">LinkedIn <svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M6 3h7v7M13 3L4 12\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<a href=\"https://engineering.gwu.edu/kartik-v-bulusu\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #CDBF9F; color: #033C5A; text-decoration: none; font-size: 14px; font-weight: 600; box-sizing: border-box\">Faculty bio <svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M6 3h7v7M13 3L4 12\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<a href=\"https://bulusuk.github.io\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #CDBF9F; color: #033C5A; text-decoration: none; font-size: 14px; font-weight: 600; box-sizing: border-box\">Personal website <svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M6 3h7v7M13 3L4 12\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display: flex; flex-wrap: wrap; gap: 28px; align-items: center; background: #F6F1E8; border-radius: 20px; padding: 28px\">\n<img src=\"b58cdbd1-80ea-48ac-b3b0-29b024c8ecf7\" alt=\"Heidi Gibson\" style=\"width: 160px; height: 200px; flex-shrink: 0; border-radius: 14px; object-fit: cover; object-position: center 20%; display: block; border-bottom: 4px solid #D6BF91\">\n<div style=\"flex: 1 1 220px; min-width: 0\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #4E6273; margin-bottom: 10px\">Convener · Smithsonian<\u002Fdiv>\n<h3 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 28px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 8px; color: #033C5A\">Heidi Gibson<\u002Fh3>\n<p style=\"margin: 0 0 4px; font-weight: 600\">Manager, Global Sustainability Series<\u002Fp>\n<p style=\"margin: 0\"><a href=\"https://ssec.si.edu\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #0067B0\">Smithsonian Science Education Center<\u002Fa><\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px\">\n<a href=\"https://www.linkedin.com/in/heidi-gibson-5b341a64/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #CDBF9F; color: #033C5A; text-decoration: none; font-size: 14px; font-weight: 600; box-sizing: border-box\">LinkedIn <svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M6 3h7v7M13 3L4 12\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto\">\n<p style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #033C5A; margin: 0 0 16px\">03 · Who's in the room<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 48px\">\n<h2 style=\"font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 3.6vw, 48px); line-height: 1.05; letter-spacing: -0.025em; margin: 0; max-width: 680px\">Twenty voices, four van
